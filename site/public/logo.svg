<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 250" role="img" aria-label="6170 Properties">
  <!-- Uses currentColor so it inherits the surrounding text color.
       A faithful recreation of the 6170 Properties logo mark. -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square">
    <!-- roofline -->
    <path d="M28 92 L130 26 L232 92" />
    <!-- eave ticks -->
    <path d="M22 96 H40" />
    <path d="M220 96 H238" />
    <!-- chimney on the right slope -->
    <path d="M176 55 V40 H190 V70" />
  </g>
  <g fill="currentColor" font-family="'Source Serif 4','Iowan Old Style',Palatino,Georgia,'Times New Roman',serif" text-anchor="middle">
    <text x="130" y="182" font-size="104" font-weight="600" letter-spacing="4">6170</text>
  </g>
  <line x1="40" y1="205" x2="220" y2="205" stroke="currentColor" stroke-width="3" />
  <text x="130" y="236" fill="currentColor" text-anchor="middle" font-family="'Source Serif 4','Iowan Old Style',Palatino,Georgia,'Times New Roman',serif" font-size="26" letter-spacing="10">PROPERTIES</text>
</svg>
